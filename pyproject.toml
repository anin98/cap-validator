[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycap-validator"
version = "1.1.0"
authors = [
    {name = "Anindita Bose", email = "firstaninditabose@gmail.com"},
]
description = "A comprehensive Python library for validating and generating OASIS CAP 1.2 compliant XML messages"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lxml>=4.6.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "click>=8.0.0",
    "xmlschema>=1.10.0",
]
keywords = ["cap", "common alerting protocol", "xml", "validation", "emergency", "alert", "oasis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Communications",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/anin98/cap-validator"
Repository = "https://github.com/anin98/cap-validator"
"Bug Reports" = "https://github.com/anin98/cap-validator/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cap_validator*"]

[tool.setuptools.package-data]
cap_validator = ["*.xsd"]

[tool.setuptools]
license-files = []